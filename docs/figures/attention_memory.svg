<svg xmlns="http://www.w3.org/2000/svg" width="760" height="420" viewBox="0 0 760 420" role="img" aria-labelledby="title desc"><title id="title">PyTorch attention memory baseline</title><desc id="desc">Allocated memory for SDPA and materialized causal attention at contexts 128, 256 and 512 on an RTX 3060 Laptop GPU.</desc><rect width="760" height="420" fill="#fff"/><text x="70" y="36" font-family="Arial" font-size="22" font-weight="700">GPU attention memory baseline</text><text x="70" y="60" font-family="Arial" font-size="13" fill="#555">Allocated bytes · float16 · B=1, H=4, head dimension=64</text><line x1="80" y1="350" x2="710" y2="350" stroke="#222"/><line x1="80" y1="85" x2="80" y2="350" stroke="#222"/><g font-family="Arial" font-size="12" fill="#444"><text x="45" y="354">0</text><text x="25" y="225">7 MB</text><text x="20" y="95">14 MB</text><text x="125" y="374">128</text><text x="325" y="374">256</text><text x="525" y="374">512</text><text x="300" y="405">Context length</text><text transform="translate(15,285) rotate(-90)">Allocated memory</text></g><path d="M150 345 L350 178 L550 168" fill="none" stroke="#2563eb" stroke-width="4"/><path d="M180 181 L380 157 L580 84" fill="none" stroke="#dc2626" stroke-width="4"/><g fill="#2563eb"><circle cx="150" cy="345" r="6"/><circle cx="350" cy="178" r="6"/><circle cx="550" cy="168" r="6"/></g><g fill="#dc2626"><circle cx="180" cy="181" r="6"/><circle cx="380" cy="157" r="6"/><circle cx="580" cy="84" r="6"/></g><g font-family="Arial" font-size="13"><rect x="560" y="25" width="14" height="4" fill="#2563eb"/><text x="582" y="31">SDPA</text><rect x="635" y="25" width="14" height="4" fill="#dc2626"/><text x="653" y="31">Materialized</text></g></svg>
