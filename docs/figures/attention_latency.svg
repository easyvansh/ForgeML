<svg xmlns="http://www.w3.org/2000/svg" width="760" height="420" viewBox="0 0 760 420" role="img" aria-labelledby="title desc"><title id="title">PyTorch attention latency baseline</title><desc id="desc">Median CUDA event latency for SDPA and materialized causal attention at contexts 128, 256 and 512.</desc><rect width="760" height="420" fill="#fff"/><text x="70" y="36" font-family="Arial" font-size="22" font-weight="700">GPU attention latency baseline</text><text x="70" y="60" font-family="Arial" font-size="13" fill="#555">Median CUDA-event time · milliseconds · 5 timed samples after warmup</text><line x1="80" y1="350" x2="710" y2="350" stroke="#222"/><line x1="80" y1="85" x2="80" y2="350" stroke="#222"/><g font-family="Arial" font-size="12" fill="#444"><text x="45" y="354">0</text><text x="25" y="225">0.75</text><text x="25" y="95">1.5</text><text x="125" y="374">128</text><text x="325" y="374">256</text><text x="525" y="374">512</text><text x="300" y="405">Context length</text><text transform="translate(15,285) rotate(-90)">Milliseconds</text></g><path d="M150 302 L350 312 L550 289" fill="none" stroke="#2563eb" stroke-width="4"/><path d="M180 283 L380 284 L580 107" fill="none" stroke="#dc2626" stroke-width="4"/><g fill="#2563eb"><circle cx="150" cy="302" r="6"/><circle cx="350" cy="312" r="6"/><circle cx="550" cy="289" r="6"/></g><g fill="#dc2626"><circle cx="180" cy="283" r="6"/><circle cx="380" cy="284" r="6"/><circle cx="580" cy="107" r="6"/></g><g font-family="Arial" font-size="13"><rect x="560" y="25" width="14" height="4" fill="#2563eb"/><text x="582" y="31">SDPA</text><rect x="635" y="25" width="14" height="4" fill="#dc2626"/><text x="653" y="31">Materialized</text></g></svg>
